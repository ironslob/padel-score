name: WristRally
options:
  bundleIdPrefix: com.codebrewery.wristrally
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  SWIFT_VERSION: "5.0"
targets:
  WristRally:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: iPhone/WristRally
        excludes:
          - Info.plist
      - path: shared
        excludes:
          - "**/*Tests*"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.wristrally
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: iPhone/WristRally/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: Wrist Rally
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      CODE_SIGN_ENTITLEMENTS: iPhone/WristRally/WristRally.entitlements
      CURRENT_PROJECT_VERSION: 6
      MARKETING_VERSION: "1.0"
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
    capabilities:
      App Groups:
        enabled: true
        groups:
          - group.com.codebrewery.wristrally
    dependencies:
      - target: WristRallyWatch
        embed: true
      - target: WristRallyLiveActivity
        embed: true
    scheme:
      testTargets:
        - WristRallyTests

  WristRallyLiveActivity:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: iPhone/WristRallyLiveActivity
        excludes:
          - Info.plist
      - path: shared
        excludes:
          - "**/*Tests*"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.wristrally.liveactivity
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: iPhone/WristRallyLiveActivity/Info.plist
      CODE_SIGN_ENTITLEMENTS: iPhone/WristRallyLiveActivity/WristRallyLiveActivity.entitlements
      CURRENT_PROJECT_VERSION: 6
      MARKETING_VERSION: "1.0"
      TARGETED_DEVICE_FAMILY: "1"
    capabilities:
      App Groups:
        enabled: true
        groups:
          - group.com.codebrewery.wristrally
    scheme: {}

  WristRallyWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: watch/WristRallyWatch
        excludes:
          - Info.plist
      - path: shared
        excludes:
          - "**/*Tests*"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.wristrally.watchkitapp
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: watch/WristRallyWatch/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: Wrist Rally
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.codebrewery.wristrally
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
      INFOPLIST_KEY_NSHealthShareUsageDescription: Wrist Rally reads workout data when you choose to track a match as a workout.
      INFOPLIST_KEY_NSHealthUpdateUsageDescription: Wrist Rally saves workout duration when you track a match as a workout.
      CODE_SIGN_ENTITLEMENTS: watch/WristRallyWatch/WristRallyWatch.entitlements
      CURRENT_PROJECT_VERSION: 6
      MARKETING_VERSION: "1.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      SUPPORTED_PLATFORMS: "watchos watchsimulator"
    dependencies:
      - target: WristRallyComplications
        embed: true
    capabilities:
      App Groups:
        enabled: true
        groups:
          - group.com.codebrewery.wristrally
      HealthKit:
        enabled: true
    scheme: {}

  WristRallyComplications:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: watch/WristRallyComplications
        excludes:
          - Info.plist
      - path: shared
        excludes:
          - "**/*Tests*"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.wristrally.watchkitapp.complications
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: watch/WristRallyComplications/Info.plist
      CODE_SIGN_ENTITLEMENTS: watch/WristRallyComplications/WristRallyComplications.entitlements
      CURRENT_PROJECT_VERSION: 6
      MARKETING_VERSION: "1.0"
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      SUPPORTED_PLATFORMS: "watchos watchsimulator"
    capabilities:
      App Groups:
        enabled: true
        groups:
          - group.com.codebrewery.wristrally
    scheme: {}

  WristRallyTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: tests/Unit
      - path: shared
        excludes:
          - "**/*Tests*"
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.codebrewery.wristrally.tests
      TARGETED_DEVICE_FAMILY: "1"
      # Hostless unit tests — shared sources compiled into the test bundle.
      TEST_HOST: ""
      BUNDLE_LOADER: ""

schemes:
  WristRally:
    build:
      targets:
        WristRallyWatch: [all]
        WristRally: [all]
        WristRallyTests: [test]
    test:
      targets:
        - WristRallyTests
  WristRallyWatch:
    build:
      targets:
        WristRallyWatch: [all]
  WristRallyTests:
    build:
      targets:
        WristRallyTests: [build, test]
    test:
      targets:
        - WristRallyTests
      gatherCoverageData: false
